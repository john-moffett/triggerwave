<script>
(function () {
  var tw = window.TW; if (!tw) return;
  // (an iPhone goes to the App Store only once it has the game everywhere: until then, the home page says where)
  var to = tw.platform === "android" ? tw.play("shortlink")
         : tw.platform === "ios" && tw.iosEverywhere ? tw.appStore
         : "/";
  if (/[?&]dry\b/.test(location.search)) { window.target = to; console.log("would go to " + to); return; }   // (?dry: say, don't go)
  location.replace(to);
})();
</script>
